<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday Sneha! 🎂</title>
    <style>
        :root {
            --pink: #ff6b8a;
            --purple: #c77dff;
            --gold: #ffd166;
            --rose: #ff8cab;
            --sky: #7bdff2;
            --peach: #ffb5a7;
            --lavender: #d4a5ff;
            --mint: #06d6a0;
            --blush: #ffc8dd;
            --coral: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans Devanagari', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #f8e8ff 25%, #e8eaf6 50%, #fce4ec 75%, #fff0f5 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes bgShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        /* Floating sparkles in background */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 20px;
            animation: sparkleFloat linear infinite;
            opacity: 0;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            5% {
                opacity: 0.8;
                transform: translateY(95vh) rotate(45deg) scale(1);
            }
            50% {
                opacity: 0.6;
                transform: translateY(50vh) rotate(180deg) scale(0.7);
            }
            90% {
                opacity: 0.3;
                transform: translateY(5vh) rotate(300deg) scale(0.4);
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Main container */
        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ========== INITIAL GREETING CARD ========== */
        .initial-card {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(255, 107, 138, 0.25), 0 5px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            background-clip: padding-box;
            max-width: 420px;
            width: 90%;
            animation: cardPulse 2.5s ease-in-out infinite;
            z-index: 10;
        }

        .initial-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 27px;
            padding: 3px;
            background: linear-gradient(135deg, #ff6b8a, #c77dff, #ffd166, #ff6b8a);
            background-size: 300% 300%;
            animation: borderGlow 3s ease infinite;
            z-index: -1;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes cardPulse {
            0%,
            100% {
                transform: translateY(0);
                box-shadow: 0 20px 60px rgba(255, 107, 138, 0.25), 0 5px 20px rgba(0, 0, 0, 0.08);
            }
            50% {
                transform: translateY(-8px);
                box-shadow: 0 30px 70px rgba(255, 107, 138, 0.35), 0 8px 25px rgba(0, 0, 0, 0.1);
            }
        }

        .initial-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 30px 70px rgba(255, 107, 138, 0.35), 0 8px 25px rgba(0, 0, 0, 0.12);
        }
        .initial-card:active {
            transform: scale(0.96);
            transition: transform 0.15s ease;
        }

        .initial-card .icon-row {
            font-size: 50px;
            margin-bottom: 12px;
            animation: bounceIcon 1.5s ease-in-out infinite;
        }
        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-18px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-8px);
            }
        }

        .initial-card .name-display {
            font-size: 2.6em;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b8a, #c77dff, #e04090);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0;
            letter-spacing: 1px;
        }
        .initial-card .subtitle {
            font-size: 1.05em;
            color: #888;
            margin-top: 6px;
            font-weight: 500;
        }
        .initial-card .click-hint {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 28px;
            background: linear-gradient(135deg, #ff6b8a, #e04090);
            color: white;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1em;
            letter-spacing: 0.5px;
            animation: hintGlow 2s ease-in-out infinite;
            box-shadow: 0 6px 20px rgba(255, 107, 138, 0.4);
        }
        @keyframes hintGlow {
            0%,
            100% {
                box-shadow: 0 6px 20px rgba(255, 107, 138, 0.4);
            }
            50% {
                box-shadow: 0 10px 30px rgba(255, 107, 138, 0.7), 0 0 40px rgba(255, 107, 138, 0.3);
            }
        }

        .initial-card.hidden {
            opacity: 0;
            transform: scale(0.8) translateY(30px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.6, 0, 0.4, 1);
        }

        /* ========== BIRTHDAY MESSAGE (hidden initially) ========== */
        .birthday-message {
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 8;
            margin-bottom: 20px;
        }
        .birthday-message.revealed {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .birthday-message .big-emoji {
            font-size: 80px;
            animation: bigBounce 0.8s ease-in-out infinite alternate;
            display: block;
        }
        @keyframes bigBounce {
            0% {
                transform: translateY(0) rotate(-5deg);
            }
            100% {
                transform: translateY(-20px) rotate(5deg);
            }
        }
        .birthday-message .happy-text {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b8a, #c77dff, #ff6b8a, #e04090);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease infinite;
            letter-spacing: 2px;
            margin: 10px 0;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .birthday-message .name-big {
            font-size: 4em;
            font-weight: 900;
            color: #c77dff;
            text-shadow: 0 4px 20px rgba(199, 125, 255, 0.5);
            letter-spacing: 3px;
            animation: nameGlow 2s ease-in-out infinite;
        }
        @keyframes nameGlow {
            0%,
            100% {
                text-shadow: 0 4px 20px rgba(199, 125, 255, 0.5);
            }
            50% {
                text-shadow: 0 8px 35px rgba(199, 125, 255, 0.8), 0 0 60px rgba(255, 107, 138, 0.4);
            }
        }
        .birthday-message .date-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ffd166, #ffb347);
            color: #5c3d00;
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1em;
            margin-top: 8px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 209, 102, 0.5);
        }
        .birthday-message .balloon-hint {
            margin-top: 16px;
            color: #888;
            font-size: 1em;
            font-weight: 500;
            animation: fadeHint 2s ease-in-out infinite;
        }
        @keyframes fadeHint {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== BALLOONS CONTAINER ========== */
        .balloons-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }
        .balloons-container.active {
            pointer-events: auto;
        }

        /* Balloon wrapper */
        .balloon-wrapper {
            position: absolute;
            bottom: -220px;
            pointer-events: auto;
            cursor: pointer;
            animation: floatUp linear forwards;
            z-index: 4;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(calc(-100vh - 300px));
            }
        }

        .balloon-bob {
            animation: wobble ease-in-out infinite;
        }
        @keyframes wobble {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(15px);
            }
            50% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(-15px);
            }
        }

        .balloon-body {
            width: 70px;
            height: 88px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -8px -8px 20px rgba(0, 0, 0, 0.15), inset 4px 4px 15px rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }
        .balloon-body:hover {
            transform: scale(1.12);
        }
        .balloon-body .shine {
            position: absolute;
            width: 18px;
            height: 22px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            top: 15px;
            left: 16px;
            transform: rotate(-20deg);
        }
        .balloon-knot {
            width: 10px;
            height: 12px;
            background: inherit;
            margin: 0 auto;
            border-radius: 0 0 4px 4px;
            position: relative;
            top: -2px;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2);
        }
        .balloon-string {
            width: 1.5px;
            height: 55px;
            background: #999;
            margin: 0 auto;
            border-radius: 1px;
            animation: stringSway ease-in-out infinite;
        }
        @keyframes stringSway {
            0%,
            100% {
                transform: rotate(0deg);
            }
            30% {
                transform: rotate(3deg);
            }
            70% {
                transform: rotate(-3deg);
            }
        }

        /* Balloon pop animation */
        .balloon-wrapper.popping .balloon-body {
            animation: popBurst 0.5s ease-out forwards;
        }
        .balloon-wrapper.popping .balloon-knot,
        .balloon-wrapper.popping .balloon-string {
            opacity: 0;
            transition: opacity 0.2s;
        }
        @keyframes popBurst {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            40% {
                transform: scale(2.2);
                opacity: 0.7;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* Pop particles */
        .pop-particle {
            position: fixed;
            pointer-events: none;
            z-index: 6;
            border-radius: 50%;
            animation: particleFly 0.7s ease-out forwards;
        }
        @keyframes particleFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        /* ========== WISH MODAL ========== */
        .wish-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .wish-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .wish-card {
            background: white;
            border-radius: 20px;
            padding: 35px 28px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: cardIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .wish-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(135deg, #ff6b8a, #c77dff, #ffd166);
            z-index: -1;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        @keyframes cardIn {
            0% {
                transform: scale(0.3) translateY(40px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .wish-card .wish-emoji {
            font-size: 60px;
            margin-bottom: 10px;
            animation: popIn 0.6s 0.2s both;
        }
        @keyframes popIn {
            0% {
                transform: scale(0);
            }
            70% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }
        .wish-card .wish-text {
            font-size: 1.3em;
            font-weight: 600;
            color: #444;
            margin: 10px 0;
            line-height: 1.5;
        }
        .wish-card .wish-from {
            font-size: 0.95em;
            color: #999;
            margin-top: 6px;
            font-style: italic;
        }
        .wish-card .close-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 30px;
            background: linear-gradient(135deg, #ff6b8a, #e04090);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(255, 107, 138, 0.35);
            transition: all 0.3s ease;
        }
        .wish-card .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 138, 0.5);
        }
        .wish-card .close-btn:active {
            transform: scale(0.95);
        }

        /* ========== HEART RAIN (occasional) ========== */
        .heart-drop {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 24px;
            animation: heartFall linear forwards;
        }
        @keyframes heartFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.9;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .initial-card {
                padding: 28px 20px;
                border-radius: 20px;
            }
            .initial-card .name-display {
                font-size: 2em;
            }
            .initial-card .icon-row {
                font-size: 38px;
            }
            .birthday-message .happy-text {
                font-size: 2em;
                letter-spacing: 1px;
            }
            .birthday-message .name-big {
                font-size: 2.8em;
                letter-spacing: 1px;
            }
            .birthday-message .big-emoji {
                font-size: 55px;
            }
            .balloon-body {
                width: 52px;
                height: 66px;
            }
            .balloon-body .shine {
                width: 13px;
                height: 16px;
                top: 10px;
                left: 12px;
            }
            .balloon-knot {
                width: 7px;
                height: 9px;
            }
            .balloon-string {
                height: 40px;
                width: 1px;
            }
            .wish-card {
                padding: 25px 18px;
                border-radius: 16px;
            }
            .wish-card .wish-text {
                font-size: 1.1em;
            }
            .wish-card .wish-emoji {
                font-size: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Sparkles will be added by JS -->
    <div id="sparklesContainer"></div>

    <!-- Main Content -->
    <div class="main-container" id="mainContainer">

        <!-- Initial Clickable Card -->
        <div class="initial-card" id="initialCard" title="Click for a surprise! 🎁">
            <div class="icon-row">💌</div>
            <div class="name-display">Sneha</div>
            <div class="subtitle">Tumhare liye ek special surprise hai... 💝</div>
            <div class="click-hint">✨ Click Karo ✨</div>
        </div>

        <!-- Birthday Message (hidden) -->
        <div class="birthday-message" id="birthdayMessage">
            <span class="big-emoji">🎂</span>
            <div class="happy-text">Happy Birthday</div>
            <div class="name-big">Sneha!</div>
            <div class="date-tag">🌟 3 August 🌟</div>
            <div class="balloon-hint">🎈 Neeche balloons pe click karo! 🎈</div>
        </div>
    </div>

    <!-- Balloons Container -->
    <div class="balloons-container" id="balloonsContainer"></div>

    <!-- Wish Modal -->
    <div class="wish-overlay" id="wishOverlay">
        <div class="wish-card" id="wishCard">
            <div class="wish-emoji" id="wishEmoji"></div>
            <div class="wish-text" id="wishText"></div>
            <div class="wish-from">- Tumhara Best Friend 💖</div>
            <button class="close-btn" id="closeWishBtn">🎈 Aur Balloons Dekho!</button>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM ELEMENTS ============
            const initialCard = document.getElementById('initialCard');
            const birthdayMessage = document.getElementById('birthdayMessage');
            const balloonsContainer = document.getElementById('balloonsContainer');
            const wishOverlay = document.getElementById('wishOverlay');
            const wishEmoji = document.getElementById('wishEmoji');
            const wishText = document.getElementById('wishText');
            const closeWishBtn = document.getElementById('closeWishBtn');
            const confettiCanvas = document.getElementById('confettiCanvas');
            const ctx = confettiCanvas.getContext('2d');

            // ============ STATE ============
            let greetingRevealed = false;
            let activeBalloons = [];
            let maxBalloons = 7;
            let balloonIdCounter = 0;
            let confettiPieces = [];
            let isConfettiRunning = true;

            // ============ WISHES POOL ============
            const wishes = [
                { text: "Happy Birthday to the most amazing friend in the whole world! Tum jaisi dost milna blessing hai. 🎂✨", emoji: "🎉" },
                { text: "Sneha, you make life so much brighter just by being in it! Stay awesome forever. 💖🌟", emoji: "💝" },
                { text: "Wishing you all the happiness, laughter, and success in the world! You deserve it all. 😊💫", emoji: "🌈" },
                { text: "May all your dreams come true, beautiful! Yeh saal tumhara best saal ho! 🎯✨", emoji: "💎" },
                { text: "You're the best friend anyone could ever ask for. Thank you for being YOU! 🤗💕", emoji: "🦋" },
                { text: "Have a fabulous birthday filled with joy, cake, and everything nice! 🍰🎈", emoji: "🎀" },
                { text: "Stay as wonderful, kind, and gorgeous as you are, Sneha! Duniya tumhari ho! 🌸👑", emoji: "👑" },
                { text: "Cheers to another year of awesome memories together! Love you loads! 🥂💗", emoji: "🥂" },
                { text: "Tum jaisi dost kismat walon ko milti hai. Happy Birthday meri favorite insaan! 💝🤩", emoji: "🤩" },
                { text: "Shine bright like the star you are, Sneha! Today is YOUR day! 🌟🎂", emoji: "⭐" },
                { text: "Sending you a sky full of love and a heart full of wishes! Happy Birthday! 💖☁️", emoji: "💌" },
                { text: "Tumhari smile duniya ki sabse khoobsurat cheez hai. Keep smiling always! 😍🌸", emoji: "😍" },
                { text: "Happy Birthday to my partner-in-crime, my vibe, my forever bestie! 🎉💃", emoji: "💃" },
                { text: "May this birthday bring you everything you've been wishing for! Tum deserve karti ho! 🎁✨", emoji: "🎁" },
                { text: "You're not just a friend, you're family. Happy Birthday, Sneha! Love you! 🏠💕", emoji: "💖" },
            ];

            let usedWishIndices = [];

            function getRandomWish() {
                if (usedWishIndices.length >= wishes.length) {
                    usedWishIndices = [];
                }
                let availableIndices = [];
                for (let i = 0; i < wishes.length; i++) {
                    if (!usedWishIndices.includes(i)) availableIndices.push(i);
                }
                const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                usedWishIndices.push(randomIndex);
                return wishes[randomIndex];
            }

            // ============ BALLOON COLORS ============
            const balloonColors = [
                { bg: 'radial-gradient(circle at 30% 25%, #ff9ebb, #ff6b8a, #e04070)', knot: '#e04070' },
                { bg: 'radial-gradient(circle at 30% 25%, #d4a5ff, #c77dff, #9b4dca)', knot: '#9b4dca' },
                { bg: 'radial-gradient(circle at 30% 25%, #ffe08a, #ffd166, #e0a800)', knot: '#e0a800' },
                { bg: 'radial-gradient(circle at 30% 25%, #ffb5c5, #ff8cab, #e0607a)', knot: '#e0607a' },
                { bg: 'radial-gradient(circle at 30% 25%, #a0e8f5, #7bdff2, #4db8c9)', knot: '#4db8c9' },
                { bg: 'radial-gradient(circle at 30% 25%, #ffc9b8, #ffb5a7, #e09080)', knot: '#e09080' },
                { bg: 'radial-gradient(circle at 30% 25%, #b8f5e0, #06d6a0, #04a878)', knot: '#04a878' },
                { bg: 'radial-gradient(circle at 30% 25%, #ffd0e0, #ffc8dd, #e8a0b8)', knot: '#e8a0b8' },
                { bg: 'radial-gradient(circle at 30% 25%, #ffaaaa, #ff6b6b, #d04444)', knot: '#d04444' },
                { bg: 'radial-gradient(circle at 30% 25%, #c8d6ff, #a0b4ff, #7088e0)', knot: '#7088e0' },
            ];

            // ============ CONFETTI ============
            function resizeCanvas() {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function createConfettiPiece(x, y) {
                const colors = ['#ff6b8a', '#c77dff', '#ffd166', '#7bdff2', '#ffb5a7', '#06d6a0', '#ff8cab',
                    '#ffc8dd', '#ff6b6b', '#d4a5ff', '#ffe08a', '#ff9ebb'
                ];
                return {
                    x: x !== undefined ? x : Math.random() * confettiCanvas.width,
                    y: y !== undefined ? y : -20 - Math.random() * 60,
                    w: 4 + Math.random() * 10,
                    h: 3 + Math.random() * 7,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: 1.5 + Math.random() * 3.5,
                    wobble: Math.random() * 2 - 1,
                    wobbleSpeed: 0.02 + Math.random() * 0.04,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 5,
                    opacity: 0.6 + Math.random() * 0.4,
                    shape: Math.random() > 0.5 ? 'rect' : 'circle',
                };
            }

            // Initialize confetti
            for (let i = 0; i < 80; i++) {
                const piece = createConfettiPiece();
                piece.y = Math.random() * confettiCanvas.height;
                confettiPieces.push(piece);
            }

            function burstConfetti(x, y, count = 30) {
                for (let i = 0; i < count; i++) {
                    const piece = createConfettiPiece(x, y);
                    piece.speed = 4 + Math.random() * 8;
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 50 + Math.random() * 150;
                    piece.vx = Math.cos(angle) * (3 + Math.random() * 7);
                    piece.vy = Math.sin(angle) * (3 + Math.random() * 7) - 4;
                    piece._burst = true;
                    piece._burstLife = 0;
                    piece._burstMaxLife = 40 + Math.random() * 40;
                    confettiPieces.push(piece);
                }
            }

            function updateConfetti() {
                if (!isConfettiRunning) return;
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

                for (let i = confettiPieces.length - 1; i >= 0; i--) {
                    const p = confettiPieces[i];

                    if (p._burst) {
                        p._burstLife++;
                        p.x += p.vx || 0;
                        p.y += p.vy || 0;
                        p.vy += 0.2;
                        p.rotation += p.rotationSpeed;
                        p.opacity = Math.max(0, 1 - p._burstLife / p._burstMaxLife);
                        if (p._burstLife >= p._burstMaxLife || p.opacity <= 0) {
                            confettiPieces.splice(i, 1);
                            continue;
                        }
                    } else {
                        p.y += p.speed;
                        p.wobble += p.wobbleSpeed;
                        p.x += Math.sin(p.wobble) * 0.8;
                        p.rotation += p.rotationSpeed;
                        if (p.y > confettiCanvas.height + 30) {
                            p.y = -30;
                            p.x = Math.random() * confettiCanvas.width;
                        }
                    }

                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    if (p.shape === 'rect') {
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Maintain minimum confetti
                const nonBurst = confettiPieces.filter(p => !p._burst);
                if (nonBurst.length < 60 && isConfettiRunning) {
                    for (let i = 0; i < 5; i++) {
                        confettiPieces.push(createConfettiPiece());
                    }
                }

                requestAnimationFrame(updateConfetti);
            }
            updateConfetti();

            // ============ SPARKLES ============
            const sparklesContainer = document.getElementById('sparklesContainer');
            const sparkleEmojis = ['✨', '⭐', '💫', '🌟', '💖', '🌸', '🪷', '💎', '🦋', '💝'];

            function createSparkle() {
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = Math.random() * 95 + '%';
                sparkle.style.fontSize = (14 + Math.random() * 22) + 'px';
                sparkle.style.animationDuration = (6 + Math.random() * 14) + 's';
                sparkle.style.animationDelay = Math.random() * 5 + 's';
                sparklesContainer.appendChild(sparkle);

                setTimeout(() => {
                    if (sparkle.parentNode) sparkle.remove();
                }, parseFloat(sparkle.style.animationDuration) * 1000 + 6000);
            }

            for (let i = 0; i < 15; i++) {
                createSparkle();
            }
            setInterval(createSparkle, 2500);

            // ============ HEART DROPS ============
            function createHeartDrop() {
                const heart = document.createElement('span');
                heart.className = 'heart-drop';
                heart.textContent = ['💕', '💖', '💗', '💝', '❤️', '🩷'][Math.floor(Math.random() * 6)];
                heart.style.left = Math.random() * 90 + '%';
                heart.style.fontSize = (16 + Math.random() * 20) + 'px';
                heart.style.animationDuration = (5 + Math.random() * 8) + 's';
                document.body.appendChild(heart);

                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, parseFloat(heart.style.animationDuration) * 1000 + 1000);
            }
            setInterval(createHeartDrop, 4000);
            for (let i = 0; i < 4; i++) {
                setTimeout(createHeartDrop, i * 800);
            }

            // ============ BALLOON CREATION ============
            function createBalloon() {
                if (!greetingRevealed) return;
                if (activeBalloons.length >= maxBalloons) return;

                const colorData = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                const id = balloonIdCounter++;
                const leftPos = 5 + Math.random() * 85; // 5% to 90%
                const duration = 9 + Math.random() * 10; // 9-19 seconds
                const wobbleDuration = 2 + Math.random() * 3;
                const size = window.innerWidth <= 600 ? (46 + Math.random() * 14) : (60 + Math.random() * 22);

                const wrapper = document.createElement('div');
                wrapper.className = 'balloon-wrapper';
                wrapper.style.left = leftPos + '%';
                wrapper.style.animationDuration = duration + 's';
                wrapper.style.bottom = '-220px';
                wrapper.dataset.balloonId = id;
                wrapper.dataset.color = colorData.bg;

                const bob = document.createElement('div');
                bob.className = 'balloon-bob';
                bob.style.animationDuration = wobbleDuration + 's';

                const body = document.createElement('div');
                body.className = 'balloon-body';
                body.style.background = colorData.bg;
                body.style.width = size + 'px';
                body.style.height = (size * 1.26) + 'px';

                const shine = document.createElement('div');
                shine.className = 'shine';
                shine.style.width = (size * 0.25) + 'px';
                shine.style.height = (size * 0.3) + 'px';
                shine.style.top = (size * 0.2) + 'px';
                shine.style.left = (size * 0.22) + 'px';
                body.appendChild(shine);

                const knot = document.createElement('div');
                knot.className = 'balloon-knot';
                knot.style.background = colorData.knot;
                knot.style.width = (size * 0.14) + 'px';
                knot.style.height = (size * 0.16) + 'px';

                const string = document.createElement('div');
                string.className = 'balloon-string';
                string.style.height = (size * 0.7) + 'px';

                bob.appendChild(body);
                bob.appendChild(knot);
                bob.appendChild(string);
                wrapper.appendChild(bob);

                // Click handler
                wrapper.addEventListener('click', function(e) {
                    if (wrapper.classList.contains('popping')) return;
                    popBalloon(wrapper, e);
                });

                // Touch handler for mobile
                wrapper.addEventListener('touchend', function(e) {
                    if (wrapper.classList.contains('popping')) return;
                    e.preventDefault();
                    popBalloon(wrapper, e.changedTouches[0] || e);
                });

                balloonsContainer.appendChild(wrapper);
                activeBalloons.push(wrapper);

                // Remove balloon when it floats past the top
                const floatDuration = parseFloat(duration) * 1000;
                setTimeout(() => {
                    removeBalloon(wrapper);
                }, floatDuration + 500);

                return wrapper;
            }

            function removeBalloon(wrapper) {
                if (!wrapper || !wrapper.parentNode) return;
                if (wrapper.classList.contains('popping')) return;
                wrapper.style.transition = 'opacity 0.5s';
                wrapper.style.opacity = '0';
                setTimeout(() => {
                    if (wrapper.parentNode) wrapper.remove();
                    const idx = activeBalloons.indexOf(wrapper);
                    if (idx > -1) activeBalloons.splice(idx, 1);
                }, 500);
            }

            function popBalloon(wrapper, event) {
                if (wrapper.classList.contains('popping')) return;
                wrapper.classList.add('popping');

                // Get balloon position for particles
                const rect = wrapper.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 3;

                // Create particles
                const colorDataStr = wrapper.dataset.color || '';
                const particleColors = ['#ff6b8a', '#c77dff', '#ffd166', '#ff8cab', '#7bdff2', '#ffb5a7', '#06d6a0',
                    '#ffc8dd', '#ff6b6b'
                ];
                for (let i = 0; i < 16; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'pop-particle';
                    particle.style.left = cx + 'px';
                    particle.style.top = cy + 'px';
                    particle.style.width = (4 + Math.random() * 10) + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.background = particleColors[Math.floor(Math.random() * particleColors
                    .length)];
                    particle.style.setProperty('--dx', (Math.random() - 0.5) * 180 + 'px');
                    particle.style.setProperty('--dy', (Math.random() - 0.5) * 180 - 30 + 'px');
                    particle.style.animationDuration = (0.4 + Math.random() * 0.6) + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 800);
                }

                // Burst confetti
                burstConfetti(cx, cy, 25);

                // Show wish
                const wish = getRandomWish();
                wishEmoji.textContent = wish.emoji;
                wishText.textContent = wish.text;
                wishOverlay.classList.add('active');

                // Remove balloon after pop
                setTimeout(() => {
                    if (wrapper.parentNode) wrapper.remove();
                    const idx = activeBalloons.indexOf(wrapper);
                    if (idx > -1) activeBalloons.splice(idx, 1);
                    // Create replacement balloon
                    setTimeout(() => {
                        if (greetingRevealed && activeBalloons.length < maxBalloons) {
                            createBalloon();
                        }
                    }, 1500);
                }, 500);
            }

            function closeWishModal() {
                wishOverlay.classList.remove('active');
            }

            closeWishBtn.addEventListener('click', closeWishModal);
            wishOverlay.addEventListener('click', function(e) {
                if (e.target === wishOverlay) closeWishModal();
            });

            // ============ INITIAL CARD CLICK ============
            initialCard.addEventListener('click', revealGreeting);
            initialCard.addEventListener('touchend', function(e) {
                e.preventDefault();
                revealGreeting();
            });

            function revealGreeting() {
                if (greetingRevealed) return;
                greetingRevealed = true;

                // Hide initial card
                initialCard.classList.add('hidden');

                // Burst confetti at center
                const cardRect = initialCard.getBoundingClientRect();
                const ccx = cardRect.left + cardRect.width / 2;
                const ccy = cardRect.top + cardRect.height / 2;
                burstConfetti(ccx, ccy, 60);
                setTimeout(() => burstConfetti(ccx - 80, ccy - 40, 30), 200);
                setTimeout(() => burstConfetti(ccx + 80, ccy - 40, 30), 350);

                // Show birthday message
                setTimeout(() => {
                    birthdayMessage.classList.add('revealed');
                }, 400);

                // Activate balloons container
                balloonsContainer.classList.add('active');

                // Start creating balloons
                setTimeout(() => {
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => createBalloon(), i * 500);
                    }
                }, 900);

                // Continuous balloon creation
                setInterval(() => {
                    if (greetingRevealed && activeBalloons.length < maxBalloons - 1) {
                        createBalloon();
                    }
                }, 3500);

                // Extra confetti bursts
                setTimeout(() => burstConfetti(ccx + 100, ccy - 100, 25), 1500);
                setTimeout(() => burstConfetti(ccx - 100, ccy - 80, 25), 2000);
            }

            // ============ KEYBOARD SUPPORT ============
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    if (!greetingRevealed && initialCard && !initialCard.classList.contains('hidden')) {
                        e.preventDefault();
                        revealGreeting();
                    }
                }
                if (e.key === 'Escape') {
                    if (wishOverlay.classList.contains('active')) {
                        closeWishModal();
                    }
                }
            });

            // ============ INITIAL SETUP ============
            console.log('🎂🎈 Happy Birthday Sneha! 🎈🎂');
            console.log('💝 Tumhari special website ready hai! Card pe click karo! 💝');
            console.log('🌟 3 August - Tumhara special din! 🌟');

            // Prevent accidental double-tap zoom on mobile
            document.addEventListener('dblclick', function(e) {
                if (e.target.closest('.balloon-wrapper') || e.target.closest('.initial-card')) {
                    e.preventDefault();
                }
            }, { passive: false });

        })();
    </script>
